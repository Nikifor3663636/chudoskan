org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# true — не пересобирать Rust при каждой сборке (если .so уже лежат в jniLibs)
skipRust=false
# Kotlin/Native: iOS-цели собираются только на macOS (CI); на Windows/Linux они тихо пропускаются.
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false
kotlin.mpp.enableCInteropCommonization=true
