    :root {
      --accent: #FF7500; --accent-dark: color-mix(in srgb, var(--accent) 92%, black); --accent-ink: #1C0D00;
      --tone: #FFF0E3; --tone-line: #FFD2AD; --link: #A84A00;
      --text: #15171C; --muted: #545B67; --bg: #F3F4F6; --card: #FFFFFF; --surface: #F7F8F9;
      --line: #E1E3E8; --strong: #C9CDD4; --focus: #1F5BC2;
      --subtle: #666C77; --hover: rgba(21,23,28,.05);
      --ok-tint: #E6F4EC; --err-tint: #FCEAE8; --ok: #1E7F47; --warn-bg: #FFF4DC; --warn: #8F5600; --err: #B42620;
      --radius-card: 8px; --radius-control: 6px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #FF7A0A; --accent-dark: color-mix(in srgb, var(--accent) 92%, white); --tone: #2A1A0C; --tone-line: #5A3413; --link: #FF9A47;
        --text: #ECEEF1; --muted: #A3AAB5; --bg: #0F1114; --card: #171A1E; --surface: #1C2025;
        --line: #2A2F36; --strong: #3A4049; --focus: #7BA7F5;
        --subtle: #8A919C; --hover: rgba(255,255,255,.05);
        --ok-tint: #13291D; --err-tint: #2E1715; --ok: #4CC27E; --warn-bg: #2B2210; --warn: #F2B33D; --err: #FF7A70;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; background: var(--bg); color: var(--text); }
    .topbar { background: var(--card); border-bottom: 1px solid var(--line); }
    .topbar-content { display: flex; align-items: center; gap: 16px; min-height: 72px; max-width: 1280px; margin: 0 auto; padding: 0 24px; }

</head>
