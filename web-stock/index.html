<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Залишки мережі · ЧудоСкан</title>
  <link rel="icon" href="../apple-touch-icon.png">
  <style>
    :root {
      --accent: #FF7500; --accent-dark: #C25500; --tone: #FFF3E8; --text: #2B2B2B; --muted: #6B6B6B;
      --line: #E7E2DD; --bg: #FAF8F6; --card: #FFFFFF; --ok: #1E8E3E; --warn-bg: #FFF4D6; --warn: #7A5200; --err: #C62828;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --tone: #3A2A1C; --text: #F2EEEA; --muted: #A9A29C; --line: #3A3633; --bg: #1A1817; --card: #242120; --warn-bg: #3A3220; --warn: #F2C766; --err: #FF8A80; --ok: #6DD58C; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 12px; padding: 18px 24px; max-width: 760px; margin: 0 auto; }
    header img { height: 36px; }
    header span { color: var(--muted); }
    main { max-width: 760px; margin: 0 auto; padding: 0 24px 48px; display: grid; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 24px; display: grid; gap: 10px; }
    h2 { margin: 0; font-size: 22px; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, select { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-weight: 400; width: 100%; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .phone { display: flex; align-items: center; gap: 8px; }
    .phone span { font-weight: 400; color: var(--muted); }
    button { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-dark); }
    button:disabled { opacity: .6; cursor: wait; }
    button.link { border: 0; background: none; color: var(--muted); padding: 4px; font-weight: 400; }
    .drop { border: 2px dashed var(--accent); background: var(--tone); border-radius: 20px; padding: 40px 24px; text-align: center; cursor: pointer; display: grid; gap: 6px; font-weight: 400; }
    .drop.over { background: var(--accent); color: #fff; }
    .drop.over .muted { color: #fff; }
    .bar { height: 10px; border-radius: 5px; background: var(--tone); overflow: hidden; }
    .bar div { height: 100%; background: var(--accent); transition: width .2s; }
    .bar div.busy { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .stats div { background: var(--bg); border-radius: 14px; padding: 12px; display: grid; }
    .stats b { font-size: 22px; font-variant-numeric: tabular-nums; }
    .stats span { color: var(--muted); font-size: 14px; }
    @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .warn { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 12px; }
    .error { color: var(--err); }
    .ok { color: var(--ok); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
    .dot.ok { background: var(--ok); } .dot.warn { background: #F2A900; }
  </style>
</head>
<body>
  <header><img src="../logo.svg" alt="Чудо Острів"><span>Залишки мережі</span></header>
  <main id="app"><div class="card"><p class="muted">Завантаження…</p></div></main>
  <noscript><p style="text-align:center">Потрібен JavaScript.</p></noscript>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
