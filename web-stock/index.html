<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Адмінка · ЧудоСкан</title>
  <link rel="icon" href="../apple-touch-icon.png">
  <style>
    :root {
      --accent: #FF7500; --accent-dark: #E56A00; --accent-ink: #1C0D00;
      --tone: #FFF0E3; --tone-line: #FFD2AD; --link: #A84A00;
      --text: #15171C; --muted: #545B67; --bg: #F1F2F4; --card: #FFFFFF; --surface: #F6F7F9;
      --line: #DFE2E8; --strong: #CCD1DA; --focus: #1F5BC2;
      --ok: #1E7F47; --warn-bg: #FFF4DC; --warn: #8F5600; --err: #B42620;
      --radius-card: 12px; --radius-control: 8px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #FF7A0A; --accent-dark: #FF932F; --tone: #2A1A0C; --tone-line: #5A3413; --link: #FF9A47;
        --text: #ECEEF1; --muted: #A3AAB5; --bg: #0F1114; --card: #171A1E; --surface: #1C2025;
        --line: #2A2F36; --strong: #3A4049; --focus: #7BA7F5;
        --ok: #4CC27E; --warn-bg: #2B2210; --warn: #F2B33D; --err: #FF7A70;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    .topbar { background: var(--card); border-bottom: 1px solid var(--line); }
    .topbar-content { display: flex; align-items: center; gap: 16px; min-height: 72px; max-width: 1280px; margin: 0 auto; padding: 0 24px; }
    .topbar img { width: 132px; height: auto; display: block; }
    .topbar span { color: var(--muted); padding-inline-start: 16px; border-inline-start: 1px solid var(--line); }
    main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; display: grid; gap: 16px; }
    main:has(.workspace) { max-width: none; padding: 0; display: block; }
    body:has(.workspace) > .topbar { display: none; }
    .workspace { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100dvh; font-size: 14px; }
    .workspace > section { min-width: 0; }
    .import-nav { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; overflow-y: auto; background: var(--card); border-inline-end: 1px solid var(--line); }
    .sidebar-brand { display: flex; align-items: center; gap: 9px; min-height: 64px; padding: 0 15px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .sidebar-brand img { display: block; width: 60px; height: auto; }
    .sidebar-brand strong { font-size: 15px; letter-spacing: -.025em; }
    .sidebar-brand small { font-size: 10px; border: 1px solid var(--line); background: var(--surface); padding: 1px 5px; border-radius: 4px; }
    .sidebar-scope { display: flex; gap: 9px; align-items: center; margin: 12px 10px 4px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    .sidebar-scope div { display: grid; line-height: 1.35; }
    .sidebar-scope small { font-size: 11px; }
    .nav-section { display: grid; gap: 2px; min-width: 0; padding: 11px 9px 0; }
    .nav-group { color: var(--muted); padding: 3px 8px; font-size: 11px; font-weight: 600; }
    .import-nav button[data-kind] { display: flex; gap: 9px; align-items: center; min-height: 34px; padding: 4px 8px; text-align: left; font-size: 13px; font-weight: 500; border-color: transparent; background: transparent; }
    .import-nav button[data-kind]:hover { background: var(--surface); }
    .import-nav button[aria-current="page"] { background: var(--tone); border-color: var(--tone-line); border-inline-start: 2px solid var(--accent); color: var(--link); font-weight: 700; }
    .import-nav .icon { width: 16px; height: 16px; }
    .account { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 5px; padding: 10px; border-top: 1px solid var(--line); }
    .account span { font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
    .account button { font-size: 12px; min-height: 32px; padding: 4px 6px; }
    .mobile-nav { display: none; }
    .page-body { display: grid; gap: 16px; padding: 18px 24px 40px; }
    .workspace .card { padding: 18px; }
    .workspace button, .workspace input { min-height: 36px; }
    .workspace button.primary { border-radius: var(--radius-control); }
    .workspace .admin-panel { padding: 0; border: 0; background: transparent; }
    .admin-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 12px; }
    #admin-search { gap: 6px; flex-wrap: nowrap; }
    #admin-search input { width: min(52vw, 252px); }
    .filters { display: flex; flex-wrap: wrap; gap: 5px; }
    .filters button { padding: 4px 10px; color: var(--muted); font-size: 12px; }
    .filters button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--card); }
    .pagination { margin-block-start: 12px; justify-content: flex-end; color: var(--muted); }
    .pagination button, .table-wrap button { min-height: 30px; font-size: 12px; padding: 3px 8px; }
    .staff-person { display: flex; align-items: center; gap: 9px; min-width: 175px; }
    .staff-person strong, .staff-person small { display: block; line-height: 1.45; }
    .staff-person strong { font-weight: 650; }
    .initials { display: grid; place-items: center; width: 29px; height: 29px; flex: 0 0 29px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 700; }
    .status-pill { display: inline-flex; border-radius: 4px; padding: 2px 7px; font-weight: 650; font-size: 11px; white-space: nowrap; }
    .status-pill.approved { background: color-mix(in srgb, var(--ok) 12%, var(--card)); color: var(--ok); }
    .status-pill.pending { background: var(--warn-bg); color: var(--warn); }
    .status-pill.blocked { background: color-mix(in srgb, var(--err) 12%, var(--card)); color: var(--err); }
    .status-pill.replaced { background: var(--surface); color: var(--muted); }
    .admin-message { padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-control); }
    .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 9px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
    .page-head h1 { font-size: 21px; line-height: 1.3; }
    .page-head small { display: block; margin-top: 2px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 700; letter-spacing: -.02em; }
    h2 { font-size: 18px; font-weight: 650; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 24px; display: grid; gap: 14px; min-width: 0; }
    main > .card, main > form { width: min(100%, 760px); justify-self: center; }
    main > #login { width: min(100%, 440px); margin-block-start: clamp(8px, 6vh, 56px); gap: 18px; }
    .login-heading { display: grid; gap: 6px; }
    #login .primary { margin-block-start: 4px; }
    .muted, small { color: var(--muted); }
    .row { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, select { font: inherit; padding: 9px 12px; border-radius: var(--radius-control); border: 1px solid var(--strong); background: var(--card); color: var(--text); font-weight: 400; width: 100%; min-height: 48px; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .phone { display: flex; align-items: center; gap: 8px; border: 1px solid var(--strong); border-radius: var(--radius-control); padding-inline-start: 12px; }
    .phone span { font-variant-numeric: tabular-nums; color: var(--muted); }
    .phone input { border: 0; min-width: 0; }
    .phone:focus-within { outline: 2px solid var(--focus); outline-offset: 3px; }
    .phone input:focus-visible { outline: none; }
    button { font: inherit; font-weight: 600; padding: 8px 14px; min-height: 48px; border-radius: var(--radius-control); border: 1px solid var(--strong); background: var(--card); color: var(--text); cursor: pointer; }
    button:hover { background: var(--surface); }
    button.primary { border-radius: 999px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button.primary:hover { background: var(--accent-dark); }
    button:disabled { opacity: .6; cursor: wait; }
    button.link { border-color: transparent; background: transparent; color: var(--link); }
    .drop { border: 1px dashed var(--strong); background: var(--surface); border-radius: var(--radius-control); padding: 28px 16px; text-align: center; display: grid; justify-items: center; gap: 8px; font-weight: 400; }
    .drop .icon { width: 32px; height: 32px; color: var(--link); }
    .drop.over { background: var(--tone); border-color: var(--accent); }
    .bar { height: 8px; border-radius: 4px; background: var(--tone); overflow: hidden; }
    .bar div { height: 100%; background: var(--accent); transition: width .2s; }
    .bar div.busy { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .bar div { transition: none; } .bar div.busy { animation: none; } }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 148px), 1fr)); gap: 8px; }
    .stats div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-control); padding: 14px; display: grid; }
    .stats b { font-size: 22px; font-variant-numeric: tabular-nums; }
    .stats span { color: var(--muted); font-size: 13px; }
    .warn { background: var(--warn-bg); color: var(--warn); padding: 10px 12px; border-radius: var(--radius-control); }
    .error { color: var(--err); }
    .ok { color: var(--ok); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
    .dot.ok { background: var(--ok); }
    .table-wrap { overflow: auto; max-height: min(68vh, 760px); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-control); }
    table { border-collapse: collapse; width: 100%; text-align: left; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 12px; }
    th { position: sticky; top: 0; background: var(--surface); white-space: nowrap; }
    th { color: var(--muted); font-size: 12px; font-weight: 650; }
    td { font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--surface); }
    td:last-child { font-variant-numeric: tabular-nums; }
    @media (max-width: 740px) {
      main { padding: 16px 12px 40px; }
      .topbar-content { padding-inline: 12px; }
      .workspace { display: block; }
      .import-nav { position: static; height: auto; overflow: visible; padding: 0 12px 10px; border: 0; border-bottom: 1px solid var(--line); }
      .sidebar-brand { padding: 0; min-height: 48px; border: 0; }
      .sidebar-scope, .nav-section { display: none; }
      .mobile-nav { display: block; min-height: 36px; padding: 4px 8px; }
      .account { padding: 4px 0 0; margin: 0; border: 0; }
      .page-head { min-height: 58px; padding: 8px 12px; }
      .page-head h1 { font-size: 18px; overflow-wrap: anywhere; }
      .page-body { padding: 12px 12px 32px; }
      .workspace .card { padding: 14px; }
      .workspace .admin-panel { padding: 0; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-content"><img src="../logo.svg" alt="Чудо Острів"><span>Адмінка</span></div></header>
  <main id="app"><div class="card"><p class="muted">Завантаження…</p></div></main>
  <noscript><p style="text-align:center">Потрібен JavaScript.</p></noscript>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
