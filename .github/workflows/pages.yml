name: Web

# Сайт проекта на GitHub Pages: страница установки (docs/) + веб-версия ЧудоСкан (/app/).
# Веб-версия — тот же Compose-интерфейс, что на iPhone, собранный в Kotlin/Wasm; ядро — Rust → WebAssembly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Де дані: firestore | supabase (змінна репозиторію BACKEND; порожньо — supabase; відкат — firestore).
env:
  BACKEND: ${{ vars.BACKEND }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/nodejs
            ~/.gradle/yarn
            core/target
          key: web-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'core/Cargo.lock') }}

      # Ключ Firebase (публичный ключ Web API; доступ к данным решают firestore.rules).
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "Firebase: on"; else echo "Firebase: off"; fi

      - run: rustup target add wasm32-unknown-unknown

      - name: Web app (Kotlin/Wasm + core.wasm)
        run: ./gradlew :shared:wasmJsBrowserDistribution --console=plain

      # Сторінка «Залишки мережі» для ПК (/stock/): звіт 1С .xlsx → Firestore, лише для stockAdmin.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Stock upload page (тести розбору звіту + збірка)
        working-directory: web-stock
        run: |
          npm ci
          npm test
          npm run build

      - name: Site
        run: |
          mkdir -p site
          cp -r docs/. site/
          cp -r shared/build/dist/wasmJs/productionExecutable site/app
          rm -f site/app/*.map
          mkdir -p site/stock
          cp web-stock/index.html web-stock/dist/app.js site/stock/
          # Публічний ключ Web API і id проєкту (доступ до даних вирішують firestore.rules).
          if [ -f app/google-services.json ]; then
            python3 -c 'import json; g=json.load(open("app/google-services.json")); print("window.CHUDO_FIREBASE=" + json.dumps({"apiKey": g["client"][0]["api_key"][0]["current_key"], "projectId": g["project_info"]["project_id"]}) + ";")' > site/stock/config.js
          else
            echo "window.CHUDO_FIREBASE=null;" > site/stock/config.js
          fi
          # Де дані: firestore | supabase (змінна репозиторію BACKEND; повернутись — змінити її й перезапустити).
          echo "window.CHUDO_BACKEND='${BACKEND:-supabase}';" >> site/stock/config.js
        env:
          BACKEND: ${{ vars.BACKEND }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
