name: Web

# Сайт проекта на GitHub Pages: страница установки (docs/) + веб-версия ЧудоСкан (/app/).
# Веб-версия — тот же Compose-интерфейс, что на iPhone, собранный в Kotlin/Wasm; ядро — Rust → WebAssembly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/nodejs
            ~/.gradle/yarn
            core/target
          key: web-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'core/Cargo.lock') }}

      # Ключ Firebase (публичный ключ Web API; доступ к данным решают firestore.rules).
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "Firebase: on"; else echo "Firebase: off"; fi

      - run: rustup target add wasm32-unknown-unknown

      - name: Web app (Kotlin/Wasm + core.wasm)
        run: ./gradlew :shared:wasmJsBrowserDistribution --console=plain

      - name: Site
        run: |
          mkdir -p site
          cp -r docs/. site/
          cp -r shared/build/dist/wasmJs/productionExecutable site/app
          rm -f site/app/*.map

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
