name: iOS

# Сборка iOS-версии на Mac-сервере GitHub: Rust-ядро → Kotlin-фреймворк (shared) → Xcode.
# Результат (вкладка Actions → запуск → Artifacts): неподписанный IPA и скриншоты из симулятора.
on:
  push:
    branches: [main]
    paths: [core/**, shared/**, iosApp/**, gradle/**, "*.gradle.kts", .github/workflows/ios.yml]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            core/target
          key: ios-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'core/Cargo.lock') }}

      # Ключ Firebase (необязательно): без него приложение соберётся, но вход будет выключен.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "Firebase: on"; else echo "Firebase: off"; fi

      - name: Rust core (iOS)
        run: bash scripts/build-ios-core.sh

      - name: Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Build for simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -n 80

      - name: Screenshots (simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          APP=$(find build/sim -name 'iosApp.app' -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.chudoostriv.app
          sleep 15
          mkdir -p shots
          xcrun simctl io "$UDID" screenshot shots/ios-start.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 3
          xcrun simctl io "$UDID" screenshot shots/ios-start-dark.png

      - name: Build for iPhone (unsigned IPA)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
          APP=$(find build/dev -name 'iosApp.app' -type d | head -1)
          mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../ChudoSkan-unsigned.ipa Payload)
          ls -la ChudoSkan-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ChudoSkan-iOS
          path: |
            ChudoSkan-unsigned.ipa
            shots/*.png
