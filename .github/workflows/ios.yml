name: iOS

# Сборка iOS-версии на Mac-сервере GitHub: Rust-ядро → Kotlin-фреймворк (shared) → Xcode.
# Результат (вкладка Actions → запуск → Artifacts): неподписанный IPA и скриншоты из симулятора.
on:
  push:
    branches: [main]
    paths: [core/**, shared/**, iosApp/**, gradle/**, "*.gradle.kts", .github/workflows/ios.yml]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    # TestFlight (необязательно): нужен Apple Developer Program. Секреты репозитория:
    #   APPLE_TEAM_ID — Team ID (developer.apple.com → Membership);
    #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 — ключ App Store Connect API с ролью Admin
    #   (App Store Connect → Users and Access → Integrations → Keys; P8 — содержимое файла целиком).
    # Без них шаг TestFlight пропускается, остальное собирается как раньше.
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            core/target
          key: ios-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'core/Cargo.lock') }}

      # Ключ Firebase (необязательно): без него приложение соберётся, но вход будет выключен.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "Firebase: on"; else echo "Firebase: off"; fi

      - name: Rust core (iOS)
        run: bash scripts/build-ios-core.sh

      - name: Kotlin framework (shared, simulator)
        run: bash ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --console=plain

      - name: Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build | tail -n 80

      - name: Screenshots (simulator)
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          APP=$(find build/sim -name 'iosApp.app' -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.chudoostriv.app
          sleep 15
          mkdir -p shots
          xcrun simctl io "$UDID" screenshot shots/ios-start.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 3
          xcrun simctl io "$UDID" screenshot shots/ios-start-dark.png

      - name: Build for iPhone (unsigned IPA)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dev \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
          APP=$(find build/dev -name 'iosApp.app' -type d | head -1)
          mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../ChudoSkan-unsigned.ipa Payload)
          ls -la ChudoSkan-unsigned.ipa

      # Подпись облачным сертификатом Apple (ключ API) и выгрузка в TestFlight.
      # Номер сборки = номер запуска CI, чтобы каждая выгрузка была новее предыдущей.
      - name: TestFlight
        if: env.ASC_KEY_P8 != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/arch -archivePath build/ChudoSkan.xcarchive \
            "${AUTH[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -n 40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/ChudoSkan.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export "${AUTH[@]}" | tail -n 40
          rm -f "$KEY"

      - uses: actions/upload-artifact@v7
        with:
          name: ChudoSkan-iOS
          path: |
            ChudoSkan-unsigned.ipa
            shots/*.png
