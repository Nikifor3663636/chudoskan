name: Android

# Rust-ядро (формат, clippy, тесты) → Android (lint, unit-тесты, release APK).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [docs/**, "*.md", iosApp/**, proxy/**, printer/**, rules-tests/**, .github/workflows/ios.yml, .github/workflows/pages.yml, .github/workflows/printer.yml, .github/workflows/rules.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: core-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            core/target
          key: android-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'core/Cargo.lock') }}

      - name: Rust для Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          # Для CoreContractTest: Kotlin-модели против настоящего ядра на ПК (core/target/debug).
          cargo build --manifest-path core/Cargo.toml

      # Ключ Firebase (необязательно): без него APK соберётся, но вход будет выключен.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi

      # Постійний ключ підпису (секрети): кожен реліз ставиться поверх попереднього — й оновлюється із застосунку.
      - name: Ключ підпису
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Немає секрету ANDROID_KEYSTORE_B64 — реліз без постійного ключа не встане поверх старої версії"; exit 1
          fi

      - name: Lint, тесты, APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :shared:testDebugUnitTest :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: ChudoSkan-Android
          path: app/build/outputs/apk/release/*.apk

      # Тег vX.Y — реліз з APK (його бере сторінка встановлення).
      - name: Реліз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "ChudoSkan-$v.apk"
          gh release create "$GITHUB_REF_NAME" "ChudoSkan-$v.apk" --latest --title "ЧудоСкан $v" \
            --notes "Android 8.0+. Нова версія ставиться поверх старої."
