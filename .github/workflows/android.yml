name: Android

# Rust-ядро (формат, clippy, тесты) → Android (lint, unit-тесты, release APK).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [docs/**, "*.md", iosApp/**, proxy/**, printer/**, rules-tests/**, .github/workflows/ios.yml, .github/workflows/pages.yml, .github/workflows/printer.yml, .github/workflows/rules.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: core-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            core/target
          key: android-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'core/Cargo.lock') }}

      - name: Rust для Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          # Для CoreContractTest: Kotlin-модели против настоящего ядра на ПК (core/target/debug).
          cargo build --manifest-path core/Cargo.toml

      # Ключ Firebase (необязательно): без него APK соберётся, но вход будет выключен.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi

      # versionCode — номер збірки (строго зростає), versionName — X.Y з тегу vX.Y.
      - name: Версія
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      # Release-ключ лише з GitHub Secrets: без того самого ключа оновлення на телефоні не встановиться.
      - name: Release-ключ
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Немає секрету ANDROID_KEYSTORE_BASE64 — реліз без release-ключа не оновить телефони (docs/onovlennia.md)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, тесты, APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:testReleaseUnitTest :shared:testDebugUnitTest :app:assembleRelease \
            -PversionCode="$VERSION_CODE" ${VERSION_NAME:+-PversionName="$VERSION_NAME"} --console=plain
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: ChudoSkan-Android
          path: app/build/outputs/apk/release/*.apk

      # Тег vX.Y — реліз: ChudoSkan-X.Y.apk (сторінка встановлення), а для автооновлення — стабільні імена
      # ChudoSkan.apk і version.json: …/releases/latest/download/version.json (без лімітів API).
      # Текст анотованого тегу — «Що нового»; слово «обов'язкове» в ньому робить оновлення обов'язковим.
      - name: Реліз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "ChudoSkan-$v.apk"
          cp "$apk" ChudoSkan.apk
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | head -c 500)
          min=0
          if echo "$notes" | grep -qi "обов'язков"; then min=$VERSION_CODE; fi
          jq -n --argjson code "$VERSION_CODE" --arg name "$v" --arg sha "$(sha256sum ChudoSkan.apk | cut -d' ' -f1)" \
            --argjson min "$min" --arg notes "$notes" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode: $code, versionName: $name, sha256: $sha, minVersionCode: $min, notes: $notes, publishedAt: $at}' > version.json
          cat version.json
          gh release create "$GITHUB_REF_NAME" "ChudoSkan-$v.apk" ChudoSkan.apk version.json --latest --title "ЧудоСкан $v" \
            --notes "Android 8.0+. Нова версія ставиться поверх старої й далі оновлюється сама. ${notes}"
